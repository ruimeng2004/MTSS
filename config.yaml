model_config:
  # api_key: sk-f2DoyE11Fecx7ej4PDu35sZ6bFtv8qb06z9XfGO4kURt5I5C # OpenAI API key
  # api_key: sk-4aba884b61424f59b1fab0f60d188103 #deepseek API key
  cp_path: 'default' # Path to local checkpoint. If the model saved in the default HuggingFace path, leave it `default`.
  remote_model: deepseek-reasoner
  local_model: mistralai/Mixtral-8x7B-Instruct-v0.1
  max_try: 2 # Use 10 for Defects4J and 3 for DebugBench
  temperature: 1.0
  remote_proxy: OpenAI
  local_proxy: batch
test_config:
  time_out: 600 # Use 10 min as default to accommodate slower computers
cookie_config: # Recommend to use at least three accounts to avoid rate limiting
  - leetcode_session: xxxxxxxx
    csrf_token: xxxxxxxx
  - leetcode_session: xxxxxxxx
    csrf_token: xxxxxxxx
  - leetcode_session: xxxxxxxx
    csrf_token: xxxxxxxx

# D4J Fix Evaluation System Configuration
evaluation_config:
  # Defects4J installation path
  d4j_path: "/Users/mengrui/Desktop/D4J/defects4j"
  
  # Workspace directory for checking out bugs
  workspace_dir: "./workspace"
  
  # Output directory for evaluation results
  output_dir: "./evaluation_output"
  
  # Test execution timeout (seconds)
  timeout: 600
  
  # Number of parallel workers for batch evaluation
  parallel_workers: 4
  
  # Enable caching of validation results
  cache_enabled: true
  
  # Deprecated bugs in D4J v3.0 (will be skipped)
  deprecated_bugs:
    - "Lang_2"
    - "Lang_18"
    - "Lang_25"
    - "Lang_48"
    - "Lang_56"
    - "JacksonDatabind_65"
    - "JacksonDatabind_89"
  
  # Normalization settings
  normalization:
    context_lines: 3  # Number of context lines in unified diff
    max_retries: 3    # Maximum retries for patch application
    
  # Logging settings
  logging:
    level: "INFO"  # DEBUG, INFO, WARNING, ERROR
    file: "evaluation.log"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
