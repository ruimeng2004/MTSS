# 实验3：多代表投票深度分析 (qwen3_coder)
name: "exp3_voting_coder"

embeddings_path: "bug_task_model_selection/data/embeddings/embeddings.jsonl"
ppl_paths:
  edit: "bug_task_model_selection/data/ppl/qwen3_coder_edit.jsonl"
  gen: "bug_task_model_selection/data/ppl/qwen3_coder_gen.jsonl"

views:
  - buggy_code

clustering_algorithms:
  - kmeans

k_values:
  - 100

sampling_methods:
  - farthest_first
  - kdpp

reps_per_cluster_values:
  - 1
  - 3
  - 5
  - 7
  - 9

output_dir: "bug_task_model_selection/data/exp3_voting_coder"
seed: 42
parallel: false
skip_existing: true
